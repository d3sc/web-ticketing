name: web-ticketing
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate .env first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -uhelpdesk helpdesk -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 300s
    restart: unless-stopped
  web:
    build: .
    image: web-ticketing:local
    environment:
      SECRET_KEY: ${SECRET_KEY:?Generate .env first}
      DATABASE_URL: mysql+pymysql://helpdesk:${DB_PASSWORD}@db/helpdesk?charset=utf8mb4
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    ports: ['127.0.0.1:5017:8000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  telegram-worker:
    image: web-ticketing:local
    environment:
      SECRET_KEY: ${SECRET_KEY:?Generate .env first}
      DATABASE_URL: mysql+pymysql://helpdesk:${DB_PASSWORD}@db/helpdesk?charset=utf8mb4
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    command: [flask, --app, helpdesk, telegram-worker]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import os,time; assert time.time()-os.stat("/tmp/telegram-worker-heartbeat").st_mtime < 600']
      interval: 30s
      timeout: 5s
      retries: 3
  test-db:
    image: mysql:8.0
    profiles: [test]
    environment:
      MYSQL_DATABASE: helpdesk_test
      MYSQL_USER: tester
      MYSQL_PASSWORD: isolated-test-only
      MYSQL_ROOT_PASSWORD: isolated-root-only
    tmpfs: ['/var/lib/mysql']
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -utester helpdesk_test -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 40
  tests:
    image: web-ticketing:local
    build: .
    profiles: [test]
    environment:
      SECRET_KEY: isolated-test-key
      DATABASE_URL: mysql+pymysql://tester:isolated-test-only@test-db/helpdesk_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://tester:isolated-test-only@test-db/helpdesk_test?charset=utf8mb4
    depends_on:
      test-db:
        condition: service_healthy
    command: [sh, -c, 'flask --app helpdesk db upgrade && python -m pytest -q']
volumes:
  mysql_data:
