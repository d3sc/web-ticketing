{% extends 'base.html' %}{% from 'macros.html' import fields,token %}{% block title %}Kategori · Helpdesk IT{% endblock %}{% block content %}<h1 class="h3">Kelola Kategori</h1><div class="row g-4"><div class="col-lg-4"><form method="post" class="card card-body"><h2 class="h5">Tambah Kategori</h2>{{ fields(form) }}<button class="btn btn-primary">Tambah</button></form></div><div class="col-lg-8">{% for c in categories %}<form method="post" action="{{ url_for('admin.edit_category',cid=c.id) }}" class="card card-body mb-3">{{ token() }}<h2 class="h5">{{ c.code }}</h2><label class="form-label" for="name-{{ c.id }}">Nama</label><input class="form-control mb-2" id="name-{{ c.id }}" name="name" value="{{ c.name }}" maxlength="100" required><label class="form-label" for="active-{{ c.id }}">Aktivasi</label><select class="form-select mb-3" id="active-{{ c.id }}" name="active"><option value="1" {{ 'selected' if c.active }}>Aktif</option><option value="0" {{ 'selected' if not c.active }}>Nonaktif</option></select><div><button class="btn btn-outline-primary">Simpan</button></div></form>{% endfor %}</div></div>{% endblock %}
